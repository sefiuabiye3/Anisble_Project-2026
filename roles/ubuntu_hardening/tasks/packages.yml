---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true

- name: Install security packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - auditd
      - audispd-plugins
      - unattended-upgrades
      - libpam-pwquality
    state: present
