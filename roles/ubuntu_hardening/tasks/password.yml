---
- name: Configure password minimum length
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^minlen'
    line: "minlen = {{ password_min_length }}"

- name: Configure password minimum classes
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^minclass'
    line: "minclass = {{ password_min_classes }}"

- name: Configure password retry attempts
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^retry'
    line: "retry = {{ password_retry }}"
