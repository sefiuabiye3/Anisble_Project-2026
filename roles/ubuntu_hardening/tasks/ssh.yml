---
- name: Configure SSH hardening
  ansible.builtin.template:
    src: ssh-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart SSH

- name: Validate SSH configuration
  ansible.builtin.command:
    cmd: sshd -t
  changed_when: false
