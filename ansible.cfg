[defaults]
# Path to your inventory file
inventory = /home/ansible/project/inventory
#roles_path = /usr/share/ansible/roles:/home/sabioye/ansible/role

# The SSH user to use for connections
remote_user = ansible

# Disables host key checking (useful for dynamic environments)
host_key_checking = False

# Path to the SSH private key
private_key_file = ~/.ssh/id_rsa

[privilege_escalation]
# Automatically use sudo for commands
become = True
become_method = sudo
become_user = root
become_ask_pass = False
